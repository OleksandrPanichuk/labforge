services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: labforge
      POSTGRES_PASSWORD: labforge
      POSTGRES_DB: labforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    # AOF: черга BullMQ має переживати ребут ноута (docs/labforge-architecture.md §11)
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
